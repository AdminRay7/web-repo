version: "3.9"

services:
  bot:
    build: ../bot-repo
    container_name: 303xmd-bot
    restart: unless-stopped
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - BOT_PORT=4000
      - BOT_HOST=0.0.0.0
      - MONGODB_URI=${MONGODB_URI}
      - DB_NAME=${DB_NAME}
      - LOG_LEVEL=info
    networks:
      - internal
    # bot is NOT exposed publicly — no ports section
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/internal/health',{headers:{'x-internal-key':process.env.INTERNAL_API_KEY}},r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: .
    container_name: 303xmd-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BOT_API_URL=http://bot:4000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - PAIR_API_KEY=${PAIR_API_KEY:-}
      - LOG_LEVEL=info
    depends_on:
      - bot
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
  public:
